# 规则配置
# 规则匹配顺序: 从上至下，匹配即停止。
# 最佳实践顺序: 强制直连/拒绝 -> 自定义分流 -> 区域规则 -> 通用规则 -> 最终匹配
rules:
  # ---------------------(1. 强制直连/拒绝 - 最高优先级)---------------------
  # -- 广告拦截规则 (REJECT) --
  # 设计思路: 尽早拦截广告请求，减少不必要的流量和代理判断。
  - DOMAIN-KEYWORD,lianmeng,REJECT  
  - DOMAIN-KEYWORD,mopub,REJECT    
  - DOMAIN-KEYWORD,uedas,REJECT    
  - DOMAIN-KEYWORD,usage,REJECT
  - RULE-SET,BanAD,REJECT
  - RULE-SET,BanProgramAD,REJECT
  - RULE-SET,AdvertisingLite_Classical,REJECT
  # -- 局域网、回环地址和系统服务 (DIRECT) --
  # 设计思路: 确保本地网络和Apple等系统服务绝对直连，避免出现网络问题。
  - IP-CIDR,17.0.0.0/8,DIRECT,no-resolve
  - RULE-SET,LocalAreaNetwork,DIRECT
  - RULE-SET,Apple,DIRECT
  - RULE-SET,DouYin,DIRECT
  # -- 自定义直连规则 (DIRECT) --
  # 设计思路: 您个人希望强制直连的域名，优先级高于所有代理规则。
  - DOMAIN-SUFFIX,macpaw.com,DIRECT
  - DOMAIN-SUFFIX,sub-page.proxys.ip-ddns.com,DIRECT
  - DOMAIN-SUFFIX,canva.cn,DIRECT
  - DOMAIN-SUFFIX,warhut.cn,DIRECT
  - DOMAIN-SUFFIX,linux.do,DIRECT
  - DOMAIN-SUFFIX,aicnn.cn,DIRECT
  - DOMAIN-SUFFIX,login.bce.baidu.com,DIRECT
  - DOMAIN-SUFFIX,boju.cc,DIRECT
  - DOMAIN-SUFFIX,riskbird.com,DIRECT
  - DOMAIN-SUFFIX,rewards.bing.com,DIRECT
  - DOMAIN-SUFFIX,cn.bing.com,DIRECT
  - DOMAIN-SUFFIX,cpuid.com,DIRECT
  - DOMAIN-SUFFIX,deepl.com,DIRECT
  - DOMAIN-SUFFIX,netcup.com,DIRECT
  - DOMAIN-SUFFIX,customercontrolpanel.de,DIRECT
  - DOMAIN-SUFFIX,love.52pokemon.cc,DIRECT
  - DOMAIN,injections.adguard.org,DIRECT
  - DOMAIN,local.adguard.org,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  # ---------------------(2. 按需分流 - 自定义代理)---------------------
  # 设计思路: 针对特定应用/服务使用特定节点组，保证体验。这些是您的核心分流策略。
  # -- 下载服务规则 --
  - RULE-SET,Download,下载节点
  - PROCESS-NAME,iMe,下载节点
  - PROCESS-NAME,Infuse,下载节点
  - PROCESS-NAME,VidHub,下载节点
  - PROCESS-NAME,SenPlayer,下载节点
  - PROCESS-NAME,NeatDownloadManager,下载节点
  - PROCESS-NAME,Motrix,下载节点
  - PROCESS-NAME,Mountain Duck,下载节点
  # - 'PROCESS-NAME,Google Drive,下载节点' # 此行已注释
  - RULE-SET,GoogleDrive,下载节点
  - DOMAIN-SUFFIX,dl.delivery.mp.microsoft.com,下载节点
  - IP-CIDR,34.82.68.179/32,下载节点,no-resolve
  - PROCESS-NAME,AdsPower Global,下载节点
  # -- AI 服务规则 --
  - PROCESS-NAME,Dia,纯净节点
  - RULE-SET,OpenAi,纯净节点
  - RULE-SET,Claude,纯净节点
  - RULE-SET,Gemini,纯净节点
  - DOMAIN-SUFFIX,account.diabrowser.engineering,纯净节点
  - DOMAIN-SUFFIX,perplexity.ai,纯净节点
  - DOMAIN-SUFFIX,genspark.ai,纯净节点
  - DOMAIN-SUFFIX,you.com,纯净节点
  - DOMAIN-SUFFIX,x.ai,纯净节点
  - DOMAIN-SUFFIX,grok.com,纯净节点
  - DOMAIN-SUFFIX,dify.ai,纯净节点
  - DOMAIN-SUFFIX,hancat.work,纯净节点
  - DOMAIN-SUFFIX,cloudns.net,纯净节点
  - DOMAIN-SUFFIX,ping0.cc,纯净节点
  - DOMAIN-SUFFIX,ipdata.co,纯净节点
  - DOMAIN-SUFFIX,digitalplat.org,纯净节点
  - DOMAIN-SUFFIX,mail.google.com,纯净节点
  - DOMAIN-SUFFIX,dataonline.vn,纯净节点
  - DOMAIN-SUFFIX,nodeseek.com,纯净节点
  # -- 流媒体服务规则 --
  - RULE-SET,YouTube,视频节点
  - RULE-SET,Spotify,Spotify
  - RULE-SET,Telegram,视频节点 # Telegram 归类于需要稳定连接的社交媒体，使用视频节点也合理
  - DOMAIN-SUFFIX,manus.im,视频节点
  - DOMAIN-SUFFIX,jsdelivr.net,视频节点
  - DOMAIN-SUFFIX,tencentcloud.com,视频节点
  # -- 微软及其他服务规则 --
  - RULE-SET,GoogleFCM,日常节点
  - RULE-SET,Bing,日常节点
  - RULE-SET,OneDrive,日常节点
  - RULE-SET,Microsoft,日常节点
  # -- 其他需要代理的精确规则 --
  # 设计思路: 放置一些无法归入以上类别但需要精确匹配的规则。
  - IP-CIDR,91.108.4.0/22,日常节点,no-resolve
  - IP-CIDR,91.108.8.0/21,日常节点,no-resolve
  - IP-CIDR,91.108.16.0/22,日常节点,no-resolve
  - IP-CIDR,91.108.56.0/22,日常节点,no-resolve
  - IP-CIDR6,2001:b28:f23d::/48,日常节点,no-resolve
  - IP-CIDR,120.232.181.162/32,日常节点,no-resolve
  - IP-CIDR,120.241.147.226/32,日常节点,no-resolve
  - IP-CIDR,120.253.253.226/32,日常节点,no-resolve
  - IP-CIDR,120.253.255.162/32,日常节点,no-resolve
  - IP-CIDR,120.253.255.34/32,日常节点,no-resolve
  - IP-CIDR,120.253.255.98/32,日常节点,no-resolve
  - IP-CIDR,180.163.150.162/32,日常节点,no-resolve
  - IP-CIDR,180.163.150.34/32,日常节点,no-resolve
  - IP-CIDR,180.163.151.162/32,日常节点,no-resolve
  - IP-CIDR,180.163.151.34/32,日常节点,no-resolve
  - IP-CIDR,203.208.39.0/24,日常节点,no-resolve
  - IP-CIDR,203.208.40.0/24,日常节点,no-resolve
  - IP-CIDR,203.208.41.0/24,日常节点,no-resolve
  - IP-CIDR,203.208.43.0/24,日常节点,no-resolve
  - IP-CIDR,203.208.50.0/24,日常节点,no-resolve
  - IP-CIDR,220.181.174.162/32,日常节点,no-resolve
  - IP-CIDR,220.181.174.226/32,日常节点,no-resolve
  - IP-CIDR,220.181.174.34/32,日常节点,no-resolve
  # ---------------------(3. 通用代理规则 - GFW & 其他)---------------------
  # 设计思路: 使用通用规则集处理需要代理的流量，这是代理的主力。
  - RULE-SET,ProxyGFWlist,日常节点
  - DOMAIN-SUFFIX,browserleaks.com,日常节点
  - DOMAIN-SUFFIX,claw.cloud,日常节点
  - DOMAIN-SUFFIX,sub.contaction.me,日常节点
  - DOMAIN-SUFFIX,cursor.com,日常节点
  - DOMAIN-SUFFIX,thunderbird.net,日常节点
  - DOMAIN-SUFFIX,please-recruit.me,日常节点
  - DOMAIN-SUFFIX,serv00.com,日常节点
  - DOMAIN-SUFFIX,sublink.proxys.ip-ddns.com,日常节点
  - DOMAIN-SUFFIX,app.warp.dev,日常节点
  # ---------------------(4. 区域规则 - 中国大陆直连)---------------------
  # 设计思路: 宽泛地直连国内域名和IP，提高访问速度。放在自定义分流之后，以防需要代理的国内服务被误伤。
  - DOMAIN-SUFFIX,cn,DIRECT
  - DOMAIN-KEYWORD,-cn,DIRECT
  - GEOIP,CN,DIRECT
  # ---------------------(5. 最终匹配 - 最低优先级)---------------------
  # 设计思路: 所有未被以上任何规则匹配的流量，都将通过此规则处理。这是保证网络连通性的最后一道防线。
  - MATCH,日常节点
subscribe-url: https://store.proxies.ip-ddns.com/s-u-b-s-t-o-r-e/download/collection/ALL
