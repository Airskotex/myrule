mode: rule
tproxy-port: 7896
mixed-port: 20150
allow-lan: false
log-level: info
ipv6: true
external-controller: 127.0.0.1:20160
secret: "Clashverge"
unified-delay: true
# DNS 配置优化
dns:
  enable: true
  enhanced-mode: fake-ip
  listen: 0.0.0.0:1053
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - tls://8.8.8.8:853
  fake-ip-filter:
    - '*.lan'
    - localhost.ptlogin2.qq.com
    - +.srv.nintendo.net
    - +.stun.playstation.net
    - +.msftconnecttest.com
    - +.msftncsi.com
    - +.xboxlive.com
    - xbox.*.microsoft.com
    - '*.battlenet.com.cn'
    - '*.battlenet.com'
    - '*.blzstatic.cn'
    - '*.battle.net'
  fake-ip-range: 198.18.0.1/16
# TUN 模式配置
tun:
  enable: true
  stack: gvisor
  device: clash-verge
  auto-detect-interface: true
  auto-route: true
  strict-route: false
  mtu: 1500
  dns-hijack:
    - any:53
    - tcp://any:53
    - udp://any:53
# 配置文件设置
profile:
  store-selected: true
# CORS 设置
external-controller-cors:
  allow-private-network: true
  allow-origins:
    - tauri://localhost
    - http://tauri.localhost
    - https://yacd.metacubex.one
    - https://metacubex.github.io
    - https://board.zash.run.place
    # 订阅节点配置
    #proxy-providers:
  #all-nodes:
  #type: http
  #url: https://store.proxies.ip-ddns.com/s-u-b-s-t-o-r-e/download/collection/ALL?target=Stash
  #interval: 3600
  #health-check:
  #url: http://www.google-analytics.com/generate_204
  #interval: 600
  #benchmark-url: http://www.google-analytics.com/generate_204
proxy-providers:
  # 第一个订阅，同时作为模板
  all-nodes: &template
    type: http
    url: https://store.proxies.ip-ddns.com/s-u-b-s-t-o-r-e/download/collection/ALL?target=Stash
    interval: 3600
    health-check:
      url: http://www.google-analytics.com/generate_204
      interval: 600
    benchmark-url: http://www.google-analytics.com/generate_204
  # 第二个订阅，继承模板设置
  okgg-nodes:
    !!merge <<: *template
    url: https://store.proxies.ip-ddns.com/s-u-b-s-t-o-r-e/download/OKGG?target=Stash
# 代理组配置
proxy-groups:
  # 全局手动选择
  - name: 手动选择
    type: select
    proxies:
      - 日常节点 # 默认选项
      - 纯净节点
      - 视频节点
      - 下载节点
      - 所有节点
      - DIRECT
      - REJECT
    use:
      - all-nodes
      - okgg-nodes
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Rocket.png
  # 日常节点组
  - name: 所有节点
    type: url-test
    use:
      - all-nodes
    url: http://www.google.com/generate_204
    interval: 300
    tolerance: 50
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
  # 纯净节点组
  - name: 纯净节点
    type: url-test
    filter: '(?i)原生|Native|Premium|专线|家宽'
    use:
      - all-nodes
    url: http://www.google.com/generate_204
    interval: 300
    tolerance: 50
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Bot.png
    # 纯净节点组
  - name: 纯净日常节点
    type: url-test
    filter: '(?i)^(?!.*(?:x15|x20)).*(?:原生|Native|Premium|专线|家宽)'
    use:
      - all-nodes
    url: http://www.google.com/generate_204
    interval: 300
    tolerance: 50
    #hidden: true

    hidden: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Bot.png
  #家宽优先的日常节点组
  - name: 日常节点
    type: fallback
    proxies:
      - 纯净日常节点
      - 所有节点
    url: http://www.google.com/generate_204
    interval: 300
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png
  # 视频节点组
  - name: 视频节点
    type: url-test
    use:
      - all-nodes
    filter: '(?i)AWS|aliyun|流媒体|Netflix|Disney'
    url: http://www.google.com/generate_204
    interval: 300
    tolerance: 50
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png
  # 下载节点组
  - name: 下载节点
    type: url-test
    use:
      - all-nodes
    filter: '(?i)WHM|大流量|下载'
    url: http://www.google.com/generate_204
    interval: 300
    tolerance: 50
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Download.png
  # Spotify 专用组
  - name: Spotify
    type: url-test
    use:
      - all-nodes
    filter: '(?i)Oracle'
    url: http://www.google.com/generate_204
    interval: 300
    tolerance: 50
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Spotify.png
    # -- 为兼容覆写文件而创建的别名组 (在UI中隐藏) --
  - name: PROXY
    type: url-test
    proxies:
      - 日常节点
    hidden: true # <-- 添加这一行即可隐藏
