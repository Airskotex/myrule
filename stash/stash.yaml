# 规则配置
# 规则匹配顺序: 从上至下，匹配即停止。
# 最佳实践顺序: 强制直连/拒绝 -> 自定义分流 -> 区域规则 -> 通用规则 -> 最终匹配
#1. 优先级排序：REJECT > DIRECT > 代理规则 > GEOIP > FINAL
#2. 规则类型顺序：IP规则 > 域名规则 > 进程规则 > 规则集
#3. 同类型规则按特殊性排序：具体域名 > 域名后缀 > 域名关键词
#4. 相同策略按功能分组：广告拦截 > 国内服务 > 代理服务 > AI服务 > 流媒体 > 下载工具 > 全局代理
#5. Remote Rule分组排序：按策略类型分组（REJECT > DIRECT > 下载 > 代理 > 流媒体 > 其他）
