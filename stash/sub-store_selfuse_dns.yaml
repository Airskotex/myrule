proxy-groups:
  # 全局手动选择
  - name: 手动选择
    type: select
    proxies:
      - 日常节点 # 默认选项
      - 纯净节点
      - 视频节点
      - 下载节点
      - 所有节点
      - DIRECT
      - REJECT
    use:
      - all-nodes
      - okgg-nodes
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Rocket.png
  # 日常节点组
  - name: 所有节点
    type: url-test
    use:
      - all-nodes
    url: http://www.google.com/generate_204
    interval: 300
    tolerance: 50
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
  # 纯净节点组
  - name: 纯净节点
    type: url-test
    filter: '(?i)原生|Native|Premium|专线|家宽'
    use:
      - all-nodes
    url: http://www.google.com/generate_204
    interval: 300
    tolerance: 50
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Bot.png  
    # 纯净节点组
  - name: 纯净日常节点
    type: url-test
    filter: '(?i)^(?!.*(?:x8|x15|x20)).*(?:原生|Native|Premium|专线|家宽)'
    use:
      - all-nodes
    url: http://www.google.com/generate_204
    interval: 300
    tolerance: 50
    #hidden: true

    hidden: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Bot.png
  #家宽优先的日常节点组
  - name: 日常节点
    type: fallback
    proxies:
      - 纯净日常节点
      - 所有节点
    url: http://www.google.com/generate_204
    interval: 300
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png
  # 视频节点组
  - name: 视频节点
    type: url-test
    use:
      - all-nodes
    filter: '(?i)AWS|Ali|流媒体|Netflix|Disney'  
    url: http://www.google.com/generate_204  
    interval: 300
    tolerance: 50
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png
  # 下载节点组
  - name: 下载节点
    type: url-test
    use:
      - all-nodes
    filter: '(?i)WHM|大流量|下载|Ali'
    url: http://www.google.com/generate_204
    interval: 300
    tolerance: 50
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Download.png
  # Spotify 专用组
  - name: Spotify
    type: url-test
    use:
      - all-nodes
    filter: '(?i)Oracle'
    url: http://www.google.com/generate_204
    interval: 300
    tolerance: 50
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Spotify.png
    # -- 为兼容覆写文件而创建的别名组 (在UI中隐藏) --
  - name: PROXY
    type: url-test
    proxies:
      - 日常节点
    hidden: true # <-- 添加这一行即可隐藏
